name: smart_gameya
description: "Smart Gameya Platform - Cross-platform digital ROSCA management mobile app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Firebase Core & Backend Services
  firebase_core: ^2.32.0
  firebase_auth: ^4.19.7
  cloud_firestore: ^4.17.5
  firebase_storage: ^11.7.7
  firebase_messaging: ^14.9.4
  google_sign_in: ^6.2.1

  # Native & Hardware Integrations
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  qr_flutter: ^4.1.0
  share_plus: ^9.0.0
  path_provider: ^2.1.3

  # Formatting & Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  csv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
